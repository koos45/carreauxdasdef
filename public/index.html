<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carreaux Das — Carrelage d'architecte à prix direct négoce</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --cd-green: #1e4d3b;
      --cd-green-hover: #163a2c;
      --cd-cream: #f7f5f0;
      --cd-gold: #e6b85c;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--cd-cream);
      color: #1f2421;
    }
    .top-banner {
      background-color: #1a241f;
      color: #ffffff;
      font-size: 0.85rem;
    }
    .btn-cd-green {
      background-color: var(--cd-green);
      color: #ffffff;
      border: none;
    }
    .btn-cd-green:hover {
      background-color: var(--cd-green-hover);
      color: #ffffff;
    }
    .btn-cd-gold {
      background-color: var(--cd-gold);
      color: #1a241f;
      font-weight: 600;
    }
    .hero-card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .filter-pill {
      border-radius: 50rem;
      border: 1px solid #d1d5db;
      background-color: #ffffff;
      color: #1f2421;
      transition: all 0.2s;
    }
    .filter-pill.active, .filter-pill:hover {
      background-color: var(--cd-green);
      color: #ffffff;
      border-color: var(--cd-green);
    }
    .product-card {
      border: none;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

  <!-- Bandeau supérieur -->
  <div class="top-banner py-2 text-center">
    <i class="bi bi-truck me-1"></i> Livraison gratuite dès 900 € d'achat partout en France
  </div>

  <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
        <span class="badge bg-success me-2 p-2"><i class="bi bi-grid-3x3-gap-fill"></i></span>
        <div>
          <span class="d-block lh-1" style="color: var(--cd-green);">Carreaux Das</span>
          <small class="text-muted fw-normal" style="font-size: 0.7rem;">Négoce Carrelage Direct & Pose Décennale</small>
        </div>
      </a>
